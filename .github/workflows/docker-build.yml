name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout f1express
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Internal data prep
        run: |
          mkdir -p public/data
          if [ -d "collector/data" ]; then
            cp collector/data/*.json public/data/ 2>/dev/null || true
            echo "Internal JSONs synced: $(ls public/data/*.json 2>/dev/null || echo 'none')"
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Verify committed dist bundle
        run: npm run verify:dist

      - name: Validate Docker bundle
        run: npm run validate:docker

  docker-publish:
    runs-on: ubuntu-latest
    needs: verify
    env:
      HUSKY: 0

    steps:
      - name: Checkout f1express
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get package version
        id: package_version
        run: echo "VERSION=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.VERSION }}.${{ github.run_number }}
