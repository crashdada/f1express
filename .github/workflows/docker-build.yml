name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout f1express
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt

      - name: Full data rebuild for verification
        run: npm run pipeline:sync:release

      - name: Internal data prep
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/data | Out-Null
          if (Test-Path 'collector/data') {
            Get-ChildItem 'collector/data' -Filter *.json -ErrorAction SilentlyContinue |
              Copy-Item -Destination 'public/data' -Force
            $synced = Get-ChildItem 'public/data' -Filter *.json -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
            if ($synced) {
              Write-Host "Internal JSONs synced: $($synced -join ', ')"
            } else {
              Write-Host 'Internal JSONs synced: none'
            }
          }

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Validate team totals and published artifacts
        run: npm run validate:team-totals

      - name: Validate Docker bundle
        run: npm run validate:docker

  docker-publish:
    runs-on: ubuntu-latest
    needs: verify
    env:
      HUSKY: 0

    steps:
      - name: Checkout f1express
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get package version
        id: package_version
        shell: bash
        run: |
          version="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate package version
        run: |
          if [ -z "${{ steps.package_version.outputs.version }}" ]; then
            echo "::error::Package version output is empty."
            exit 1
          fi
          echo "Publishing Docker tags for version ${{ steps.package_version.outputs.version }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.version }}.${{ github.run_number }}
