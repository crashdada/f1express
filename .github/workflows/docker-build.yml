name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout f1express
      uses: actions/checkout@v4

    - name: Internal data prep
      run: |
        # Ensure latest data from collector is in public/data for the build
        mkdir -p public/data
        if [ -d "collector/data" ]; then
          cp collector/data/*.json public/data/ 2>/dev/null || true
          echo "Internal JSONs synced: $(ls public/data/*.json 2>/dev/null || echo 'none')"
        fi

    # ── Docker 构建与推送 ─────────────────────────────────────────────────
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get package version
      id: package_version
      run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/f1express:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.VERSION }}
          ${{ secrets.DOCKERHUB_USERNAME }}/f1express:${{ steps.package_version.outputs.VERSION }}.${{ github.run_number }}
