name: Continuous Integration

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout f1express
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Internal data prep
        run: |
          mkdir -p public/data
          if [ -d "collector/data" ]; then
            cp collector/data/*.json public/data/ 2>/dev/null || true
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Verify committed dist bundle
        run: npm run verify:dist

      - name: Validate Docker bundle
        run: npm run validate:docker
