# F1 Express NAS deployment
# Pull the latest image built from GitHub Actions / Docker Hub, then:
#   docker compose -f docker/compose.yaml pull
#   docker compose -f docker/compose.yaml up -d

services:
  f1express:
    image: dudumin/f1express:latest
    container_name: f1express
    ports:
      - "8002:8001"
    environment:
      - F1_STORAGE_ROOT=/app/f1_storage
      - NAS_MODE=true
      - TZ=${TZ:-Asia/Shanghai}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
