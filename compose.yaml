# F1 Website — NAS Docker Compose 部署配置
#
# 部署步骤：
#   1. 将本文件和 .env 文件放在 NAS 的同一目录下
#   2. .env 内容：GIT_TOKEN=your_github_pat_token
#   3. docker compose pull && docker compose up -d
#
# Volume 说明：
#   f1_data   → /app/dist/data    持久化运行时数据 (f1.db + *.json)
#                                  NAS 上传 CSV 后热更新于此；容器重建后 JSON 从镜像刷新，f1.db 保留
#   f1_uploads → /app/uploads     上传暂存区（用户上传的 CSV 文件临时存放）

services:
  f1express:
    image: dudumin/f1express:latest
    container_name: f1express
    ports:
      - "8001:8001"
    environment:
      # GitHub PAT，用于 NAS 上传 CSV 后推送回 GitHub
      # 在同目录的 .env 文件中设置：GIT_TOKEN=ghp_xxxxxxxxxxxx
      - GIT_TOKEN=${GIT_TOKEN}
      # NAS 模式标志：启用后 sync_f1_data.py 跳过 collector 依赖步骤，改为直接热更新
      - NAS_MODE=true
      # Docker API 版本兼容：若 NAS daemon 报 "client version too new"，在此调整
      # 可通过 .env 文件覆盖：DOCKER_API_VERSION=1.43
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.43}
    volumes:
      - f1_data:/app/dist/data
      - f1_uploads:/app/uploads
      # 自更新所需：让容器能访问 Docker 守护进程，用于通过 Watchtower 重建自身
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  f1_data:
    driver: local
  f1_uploads:
    driver: local
